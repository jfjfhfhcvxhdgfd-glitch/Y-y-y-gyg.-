name: RDP
on: push
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Check Secrets
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
      run: |
        if (-not $env:RDP_PASSWORD) { throw "RDP_PASSWORD eksik" }
        if (-not $env:TAILSCALE_AUTH_KEY) { throw "TAILSCALE_AUTH_KEY eksik" }
        if (-not $env:CLOUD_COOKIE) { throw "CLOUD_COOKIE eksik" }
        Write-Host "Secrets OK"

    - name: Setup RDP
      shell: pwsh
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      run: |
        $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
        $u = Get-LocalUser -Name "Draghyper" -ErrorAction SilentlyContinue
        if (-not $u) { New-LocalUser "Draghyper" -Password $pass -PasswordNeverExpires:$true | Out-Null }
        else { Set-LocalUser "Draghyper" -Password $pass }
        Add-LocalGroupMember "Administrators" "Draghyper" -ErrorAction SilentlyContinue
        Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
        Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -Force
        Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name fDisableAudioCapture -Value 0 -PropertyType DWord -Force | Out-Null
        Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name fDisableAudioPlayback -Value 0 -PropertyType DWord -Force | Out-Null
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        Restart-Service TermService -Force
        Write-Host "RDP OK"

    - name: Clean Disk
      shell: pwsh
      run: |
        Get-ChildItem $env:TEMP, "$env:WINDIR\Temp" -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Write-Host "Disk cleaned"

    - name: Install Tailscale
      shell: pwsh
      run: |
        $msi = "$env:TEMP\ts.msi"
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
        Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
        "TAILSCALE_EXE=$env:ProgramFiles\Tailscale\tailscale.exe" | Out-File $env:GITHUB_ENV -Append

    - name: Connect Tailscale
      shell: pwsh
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        & $env:TAILSCALE_EXE up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="gh-$env:GITHUB_RUN_ID"
        Start-Sleep 5
        $ip = (& $env:TAILSCALE_EXE ip -4 | Select-Object -First 1).Trim()
        "RDP_IP=$ip" | Out-File $env:GITHUB_ENV -Append
        Write-Host "IP: $ip"

    - name: Mount TeraBox
      shell: pwsh
      env:
        CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
      run: |
        curl.exe -sL -o "$env:TEMP\rclone.zip" "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
        Expand-Archive "$env:TEMP\rclone.zip" "$env:TEMP\rclone" -Force
        $r = Get-ChildItem "$env:TEMP\rclone" -Filter "rclone-*-windows-amd64" | Select-Object -First 1
        $exe = "$($r.FullName)\rclone.exe"
        $env:RCLONE_CONFIG_MYCLOUD_TYPE = "terabox"
        $env:RCLONE_CONFIG_MYCLOUD_NDUS = $env:CLOUD_COOKIE
        Start-Process $exe -ArgumentList "mount mycloud: Z: --vfs-cache-mode writes --volname TeraBox" -NoNewWindow -PassThru
        Start-Sleep 15
        if (Test-Path "Z:\") {
          New-Item -ItemType Directory -Force "Z:\Downloads", "Z:\Temp" | Out-Null
          $dl = "C:\Users\Draghyper\Downloads"
          if (Test-Path $dl) { Remove-Item $dl -Recurse -Force -ErrorAction SilentlyContinue }
          cmd /c mklink /J $dl "Z:\Downloads"
          $t = $env:TEMP
          if (Test-Path $t) { Remove-Item $t -Recurse -Force -ErrorAction SilentlyContinue }
          cmd /c mklink /J $t "Z:\Temp"
          Write-Host "TeraBox Z: OK"
        } else { Write-Host "TeraBox FAILED" }

    - name: Keep Alive
      shell: pwsh
      run: |
        Write-Host "IP: $env:RDP_IP | User: Draghyper"
        for ($i = 1; $i -le 360; $i++) { Start-Sleep 60 }